name: Verify foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drm_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d drm_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - name: Generate dependency SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dependency-sbom
          path: sbom.cdx.json
          if-no-files-found: error
      - name: Migrate disposable database
        env:
          PGPASSWORD: postgres
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/drm_test_ci
        run: |
          npm run migrate
          npm run migrate
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d drm_test_ci -f tests/postgres/core.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d drm_test_ci -f infrastructure/postgres/provision-runtime.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d drm_test_ci -c "CREATE ROLE drm_app_test LOGIN PASSWORD 'test-only'"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d drm_test_ci -c "GRANT USAGE ON SCHEMA drm TO drm_app_test"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d drm_test_ci -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA drm TO drm_app_test"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d drm_test_ci -c "CREATE ROLE drm_api_test LOGIN PASSWORD 'test-only'; GRANT drm_runtime_api TO drm_api_test; CREATE ROLE drm_worker_test LOGIN PASSWORD 'test-only'; GRANT drm_runtime_worker TO drm_worker_test"
      - name: Start disposable self-hosted providers
        run: |
          docker run -d --rm --name drm-ci-bao -p 127.0.0.1:18200:8200 --entrypoint bao ghcr.io/openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315 server -dev -dev-root-token-id=dev-only-token -dev-listen-address=0.0.0.0:8200
          docker run -d --rm --name drm-ci-s3 -p 127.0.0.1:18333:8333 -v "$PWD/infrastructure/test/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" --entrypoint weed ghcr.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882 mini -dir=/data -bucket=drm-private-packages -s3.config=/etc/seaweedfs/s3.json
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18200/v1/sys/health > /dev/null && (echo > /dev/tcp/127.0.0.1/18333) 2>/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18200/v1/sys/health > /dev/null
          (echo > /dev/tcp/127.0.0.1/18333)
          curl --fail-with-body -sS -X POST -H 'X-Vault-Token: dev-only-token' -H 'Content-Type: application/json' -d '{"type":"transit"}' http://127.0.0.1:18200/v1/sys/mounts/transit
          curl --fail-with-body -sS -X POST -H 'X-Vault-Token: dev-only-token' -H 'Content-Type: application/json' -d '{"type":"ed25519","exportable":false}' http://127.0.0.1:18200/v1/transit/keys/license-sign
          curl --fail-with-body -sS -X POST -H 'X-Vault-Token: dev-only-token' -H 'Content-Type: application/json' -d '{"type":"aes256-gcm96","derived":true,"exportable":false}' http://127.0.0.1:18200/v1/transit/keys/tenant-key
      - name: Unit, HTTP, PostgreSQL, OpenBao, and SeaweedFS integration tests
        env:
          PG_TEST: '1'
          API_TEST: '1'
          BAO_TEST: '1'
          BAO_TEST_TOKEN: dev-only-token
          S3_TEST: '1'
          S3_TEST_ACCESS: dev-access
          S3_TEST_SECRET: dev-secret-only-for-loopback
          SELFHOST_TEST: '1'
          PG_TEST_DATABASE: drm_test_ci
          PG_TEST_HOST: 127.0.0.1
          PG_TEST_PORT: '5432'
          PG_TEST_USER: drm_app_test
          PG_RUNTIME_TEST_USER: drm_api_test
          PG_WORKER_TEST_USER: drm_worker_test
          PGPASSWORD: test-only
        run: npm test
      - name: Stop disposable providers
        if: always()
        run: docker stop drm-ci-bao drm-ci-s3 || true
      - name: Build API image
        run: docker build -t drm-api:ci .
